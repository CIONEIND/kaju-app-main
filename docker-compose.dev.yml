name: kaju-dev

services:
  postgres:
    image: postgres:17.4
    container_name: kaju-dev-postgres
    restart: unless-stopped
    # env_file injeta POSTGRES_USER/PASSWORD/DB dentro do container.
    # O bloco `environment:` foi removido de propósito: ele só interpolava
    # ${...} do arquivo .env da raiz, e sem ele o Postgres nascia sem usuário.
    env_file:
      - ./.env
    volumes:
      - /volume/containers/kaju-dev/db:/var/lib/postgresql/data
    healthcheck:
      # $$… é lido DENTRO do container, então funciona com o env_file.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaju-dev

  migrate:
    build:
      context: .
      target: builder
    image: kaju-dev-app:builder
    restart: "no"
    env_file:
      - ./.env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kaju-dev

  kaju-app:
    build:
      context: .
    image: kaju-app:dev-latest
    container_name: kaju-app-dev
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Aparece em GET /api/health — qual versão está no ar
      APP_COMMIT: ${APP_COMMIT:-local}
    ports:
      # host 3003 → container 3002
      # O app escuta na 3002 por causa do `ENV PORT=3002` do Dockerfile,
      # e o HEALTHCHECK da imagem também chama a 3002.
      - "127.0.0.1:${APP_PORT:-3003}:3002"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kaju-dev

networks:
  kaju-dev:
    name: kaju-dev
