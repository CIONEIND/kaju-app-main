name: kaju-dev

services:
  postgres:
    image: postgres:17.4
    container_name: kaju-dev-postgres
    restart: unless-stopped
    ports:
      - "0.0.0.0:5433:5432"
    env_file:
      - ./.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
