name: kaju-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: kaju-prod-postgres
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kaju}
    volumes:
      - /volume/containers/kaju/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kaju-prod

  migrate:
    build:
      context: .
      target: builder
    image: kaju-app:builder
    restart: "no"
    env_file:
      - ./.env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kaju-prod

  kaju-app:
    build:
      context: .
    image: kaju-app:prod-latest
    container_name: kaju-app-prod
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Aparece em GET /api/health — qual versão está no ar
      APP_COMMIT: ${APP_COMMIT:-local}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kaju-prod

networks:
  kaju-prod:
    name: kaju-prod
